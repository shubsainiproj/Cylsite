<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Canary Yellow Logistics LLC</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --black: #000000;
            --white: #ffffff;
            --canary: #FFD400;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--black);
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: var(--white);
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            text-align: center;
        }

        .center {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        .logo {
            max-width: 180px;
            margin-bottom: 40px;
        }

        .title {
            font-size: clamp(28px, 4vw, 48px);
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .subtitle {
            font-size: clamp(16px, 2vw, 22px);
            font-weight: 500;
            color: var(--canary);
            letter-spacing: 2px;
        }

        footer {
            font-size: 12px;
            letter-spacing: 0.8px;
            opacity: 0.85;
            padding: 24px 20px;
            max-width: 1200px;
        }

        /* Ultra-clean feel */
        img {
            filter: drop-shadow(0 0 20px rgba(255, 212, 0, 0.15));
        }
    </style>
</head>
<body>

    <div class="center">
        <img src="image-logo.jpg" alt="Canary Yellow Logistics LLC Logo" class="logo">

        <div class="title">
            Capability Statement &amp; Partnership Overview
        </div>

        <div class="subtitle">
            2025 – 2026
        </div>
    </div>

    <footer>
        MC#1533214 | 4545 Murphy Canyon Road, STE 210, San Diego, CA, 92123 | canaryyellowlogistics.com
    </footer>

</body>
</html>

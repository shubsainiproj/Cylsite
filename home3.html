<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Operational Coverage | Canary Yellow Logistics</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>
:root {
    --yellow:#FFD400;
    --white:#ffffff;
}

body {
    margin:0;
    background: radial-gradient(circle at top, #0b0b0b, #000);
    font-family: "Helvetica Neue", Arial, sans-serif;
    color: rgba(255,255,255,0.88);
}

.page {
    max-width:1200px;
    margin:auto;
    padding:80px 40px 120px;
}

h2 {
    font-size:30px;
    font-weight:700;
    padding-left:22px;
    position:relative;
}

h2::before {
    content:"";
    position:absolute;
    left:0;
    top:6px;
    width:6px;
    height:80%;
    background:linear-gradient(var(--yellow),transparent);
}

#earth {
    width:100%;
    height:560px;
    margin-top:50px;
    border-radius:22px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.15);
    background:radial-gradient(circle at center, #0b0b0b, #000);
    cursor:grab;
}
#earth:active { cursor:grabbing; }
</style>
</head>

<body>
<div class="page">
<h2>Operational Coverage</h2>
<div id="earth"></div>
</div>

<!-- THREE.JS -->
<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>

<script>
/* =========================
   SCENE SETUP
========================= */
const container = document.getElementById("earth");
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    45,
    container.clientWidth / container.clientHeight,
    0.1,
    1000
);
camera.position.z = 3.2;

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

/* =========================
   LIGHTING (SUN)
========================= */
scene.add(new THREE.AmbientLight(0x404040, 0.6));

const sunLight = new THREE.DirectionalLight(0xffffff, 1.1);
sunLight.position.set(5, 2, 5);
scene.add(sunLight);

/* =========================
   EARTH TEXTURES (NASA)
========================= */
const loader = new THREE.TextureLoader();

const earthMap = loader.load(
  "https://raw.githubusercontent.com/ajdruff/earth-textures/main/8k_earth_daymap.jpg"
);
const earthBump = loader.load(
  "https://raw.githubusercontent.com/ajdruff/earth-textures/main/8k_earth_normal_map.jpg"
);
const earthSpec = loader.load(
  "https://raw.githubusercontent.com/ajdruff/earth-textures/main/8k_earth_specular_map.jpg"
);

/* =========================
   EARTH MESH
========================= */
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(1, 128, 128),
  new THREE.MeshPhongMaterial({
      map: earthMap,
      normalMap: earthBump,
      specularMap: earthSpec,
      specular: new THREE.Color(0x333333),
      shininess: 15
  })
);

/* Real axial tilt */
earth.rotation.z = THREE.MathUtils.degToRad(23.44);
scene.add(earth);

/* =========================
   ATMOSPHERE GLOW
========================= */
const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.03, 128, 128),
  new THREE.MeshBasicMaterial({
      color:0x4db2ff,
      transparent:true,
      opacity:0.12,
      side:THREE.BackSide
  })
);
scene.add(atmosphere);

/* =========================
   LAT/LON → SPHERE
========================= */
function latLon(lat, lon, r=1.01) {
    const phi = (90-lat)*Math.PI/180;
    const theta = (lon+180)*Math.PI/180;
    return new THREE.Vector3(
        -r*Math.sin(phi)*Math.cos(theta),
         r*Math.cos(phi),
         r*Math.sin(phi)*Math.sin(theta)
    );
}

/* =========================
   PIN POINTS
========================= */
const pinGeo = new THREE.SphereGeometry(0.025, 24, 24);
const pinMat = new THREE.MeshBasicMaterial({ color:0xFFD400 });

[
    [33.7405,-118.2775], // Los Angeles
    [40.6681,-74.0451],  // NY/NJ
    [29.7325,-95.2627],  // Houston
    [41.8781,-87.6298],  // Chicago
    [43.6532,-79.3832]   // Toronto
].forEach(p=>{
    const pin = new THREE.Mesh(pinGeo,pinMat);
    pin.position.copy(latLon(p[0],p[1]));
    earth.add(pin);
});

/* =========================
   USER ROTATION (MOUSE + TOUCH)
========================= */
let isDragging = false;
let prev = { x:0, y:0 };
let velocity = { x:0, y:0 };

container.addEventListener("mousedown", e=>{
    isDragging = true;
    prev.x = e.clientX;
    prev.y = e.clientY;
});

container.addEventListener("mousemove", e=>{
    if(!isDragging) return;
    velocity.y = (e.clientX - prev.x) * 0.002;
    velocity.x = (e.clientY - prev.y) * 0.002;
    prev.x = e.clientX;
    prev.y = e.clientY;
});

container.addEventListener("mouseup", ()=> isDragging=false);
container.addEventListener("mouseleave", ()=> isDragging=false);

/* Touch */
container.addEventListener("touchstart", e=>{
    isDragging = true;
    prev.x = e.touches[0].clientX;
    prev.y = e.touches[0].clientY;
});
container.addEventListener("touchmove", e=>{
    velocity.y = (e.touches[0].clientX - prev.x) * 0.002;
    velocity.x = (e.touches[0].clientY - prev.y) * 0.002;
    prev.x = e.touches[0].clientX;
    prev.y = e.touches[0].clientY;
});
container.addEventListener("touchend", ()=> isDragging=false);

/* =========================
   ANIMATION LOOP
========================= */
function animate(){
    requestAnimationFrame(animate);

    earth.rotation.y += velocity.y;
    earth.rotation.x += velocity.x;

    velocity.x *= 0.95;
    velocity.y *= 0.95;

    renderer.render(scene,camera);
}
animate();

/* =========================
   RESIZE
========================= */
window.addEventListener("resize", ()=>{
    camera.aspect = container.clientWidth/container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth,container.clientHeight);
});
</script>
</body>
</html>
